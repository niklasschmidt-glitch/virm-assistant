name: Finalize VIRM Assistant 1.00

on:
  push:
    paths:
      - .github/workflows/publish-v1.00.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move version tag to the cleaned release commit
        shell: bash
        run: |
          git tag -f v1.00 "$GITHUB_SHA"
          git push --force origin v1.00
