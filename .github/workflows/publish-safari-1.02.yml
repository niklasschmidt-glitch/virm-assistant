name: Publish Safari 1.02

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-safari-1.02.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Safari Mobile to 1.02
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/safari-mobile-1.02.patch
          patch -p0 < /tmp/safari-mobile-1.02.patch
          sed -i 's#// @version      1.01.19#// @version      1.02#' safari/VIRM_Assistant_Safari_Mobile.meta.js

          # Safety: this public release must never contain the ADMIN build.
          if head -n 20 safari/VIRM_Assistant_Safari_Mobile.user.js | grep -qi 'ADMIN'; then
            echo 'Refusing to publish an ADMIN Safari build.' >&2
            exit 1
          fi
          if head -n 20 safari/VIRM_Assistant_Safari_Mobile.meta.js | grep -qi 'ADMIN'; then
            echo 'Refusing to publish ADMIN metadata.' >&2
            exit 1
          fi

          echo '407fed92d6b34863dbdd0f79450ece4b113ed493c581142d48ca951570bb3a5a  safari/VIRM_Assistant_Safari_Mobile.user.js' | sha256sum -c -
          grep -F '// @version      1.02' safari/VIRM_Assistant_Safari_Mobile.meta.js

      - name: Commit Safari Mobile 1.02 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add safari/VIRM_Assistant_Safari_Mobile.user.js safari/VIRM_Assistant_Safari_Mobile.meta.js
          git commit -m 'Update Safari Mobile to 1.02'
          git push

      - name: Prepare unchanged Safari Mac build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output safari/VIRM_Assistant_Safari_Computer.user.js \
            https://github.com/niklasschmidt-glitch/virm-assistant/releases/download/v1.01.19/VIRM_Assistant_Safari_Computer.user.js
          if head -n 20 safari/VIRM_Assistant_Safari_Computer.user.js | grep -qi 'ADMIN'; then
            echo 'Refusing to publish an ADMIN Safari Mac build.' >&2
            exit 1
          fi

      - name: Publish Safari release 1.02
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.02 \
            safari/VIRM_Assistant_Safari_Mobile.user.js \
            safari/VIRM_Assistant_Safari_Mobile.meta.js \
            safari/VIRM_Assistant_Safari_Computer.user.js \
            safari/VIRM_Assistant_Safari_Computer.meta.js \
            --target main \
            --title 'VIRM Assistant 1.02' \
            --notes 'Safari Mobile er opdateret til VIRM Assistant 1.02 med oprydning af træningsprogrammer, når en VMAN-gruppe slettes. Safari på Mac er uændret. / Safari Mobile is updated to VIRM Assistant 1.02 with cleanup of training programmes when a VMAN group is deleted. Safari for Mac is unchanged.'
